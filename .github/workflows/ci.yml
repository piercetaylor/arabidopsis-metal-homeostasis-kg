name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/plantgraph-ci
        ports:
          - 7687:7687
        options: >-
          --health-cmd="cypher-shell -u neo4j -p plantgraph-ci 'RETURN 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -c requirements-runtime.txt -e ".[dev,release]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Run unit tests
        run: >-
          pytest -m "not integration"
          --cov=plant_kg
          --cov-report=term-missing
          --cov-report=xml

      - name: Build and inspect release distributions
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/check_release.py dist

      - name: Audit runtime dependencies
        run: pip-audit --strict -r requirements-runtime.txt

      - name: Install wheel instead of editable checkout
        run: |
          python -m pip uninstall -y arabidopsis-metal-homeostasis-kg
          python -m pip install --no-deps dist/*.whl

      - name: Smoke-test installed CLI outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: plantgraph-ci
          NEO4J_DATABASE: neo4j
        run: |
          plant-kg --version
          plant-kg pipeline --profile fixture
          plant-kg validate

      - name: Run Neo4j integration tests with installed package
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: plantgraph-ci
          NEO4J_DATABASE: neo4j
          NEO4J_TEST_ALLOW_RESET: "1"
        run: pytest -m integration

      - name: Keep verified release candidate
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
