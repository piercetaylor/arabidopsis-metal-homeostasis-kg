name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/plantgraph-ci
        ports:
          - 7687:7687
        options: >-
          --health-cmd="cypher-shell -u neo4j -p plantgraph-ci 'RETURN 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Run unit tests
        run: >-
          pytest -m "not integration"
          --cov=plant_kg
          --cov-report=term-missing
          --cov-report=xml

      - name: Run Neo4j integration tests
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: plantgraph-ci
          NEO4J_DATABASE: neo4j
          NEO4J_TEST_ALLOW_RESET: "1"
        run: pytest -m integration
