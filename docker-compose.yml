services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-plantgraph-local}
      PLANT_KG_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-plantgraph-local}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u neo4j -p "$${PLANT_KG_NEO4J_PASSWORD}" "RETURN 1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
